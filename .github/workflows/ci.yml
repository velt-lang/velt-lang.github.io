name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue builds each queued group on a temporary ref and waits for
  # the required checks to report there — without this trigger, queued PRs
  # wait forever for checks that never start.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '22']
        include:
          - os: windows-latest
            node-version: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Every page of the built site at phone, tablet and desktop widths: no page may
  # scroll sideways or throw (scripts/check-responsive.mjs).
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Check every page at 360-1440 px
        run: pnpm check:responsive

  # Every ts/velt/tsx example in the docs checks with the velt release the docs
  # describe (DOCS_VERSION in src/lib/site.ts), and examples that import one of
  # velt's packages (http-server, sqlite, postgres, redis, web) check against the
  # packages of that release. Until the release is published, velt is built
  # from velt-lang/velt's main. scripts/check-examples.mjs.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Find the velt release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -e "console.log(require('fs').readFileSync('src/lib/site.ts','utf8').match(/DOCS_VERSION = '([^']+)'/)[1])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R velt-lang/velt >/dev/null 2>&1; then
            echo "ref=v$version" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "velt v$version is not released yet: building velt from main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out velt (its packages, and the compiler when unreleased)
        uses: actions/checkout@v7
        with:
          repository: velt-lang/velt
          ref: ${{ steps.release.outputs.ref }}
          path: velt-src

      - name: Install velt at DOCS_VERSION
        if: steps.release.outputs.released == 'true'
        run: |
          curl -fsSL https://github.com/velt-lang/velt/releases/latest/download/get-velt.sh | sh -s -- --version "${{ steps.release.outputs.version }}" --no-modify-path
          echo "$HOME/.velt/bin" >> "$GITHUB_PATH"

      - name: Build velt from main
        if: steps.release.outputs.released != 'true'
        working-directory: velt-src
        run: |
          cargo build -p veltc --bin velt
          cargo build -p velt_rt   # its own command: `--bin` would apply to it too
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          echo "VELT_RT_LIB=$PWD/target/debug/libvelt_rt.a" >> "$GITHUB_ENV"

      - name: Check the docs examples
        env:
          VELT_PACKAGES: ${{ github.workspace }}/velt-src/packages
        run: |
          velt --version
          node scripts/check-examples.mjs
