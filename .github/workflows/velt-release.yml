name: Velt release watch

# Opens a "Document velt vX.Y.Z" issue when velt-lang/velt publishes a release
# newer than the one the docs describe (DOCS_VERSION in src/lib/site.ts), so a
# release never goes undocumented. The docs-issue queue covers individual
# changes; this covers the release as a whole. See AGENTS.md, "Keeping the
# docs in sync with Velt".

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  # velt-lang/velt can trigger it right after publishing:
  #   gh api repos/velt-lang/velt-lang.github.io/dispatches -f event_type=velt-release
  repository_dispatch:
    types: [velt-release]

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Open an issue for an undocumented release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          documented=$(sed -n "s/^export const DOCS_VERSION = '\(.*\)';/\1/p" src/lib/site.ts)
          latest=$(gh release view -R velt-lang/velt --json tagName -q .tagName)
          version=${latest#v}
          echo "documented: $documented, latest: $version"
          if [ "$version" = "$documented" ]; then exit 0; fi
          # Newer only: sort -V puts the higher version last.
          if [ "$(printf '%s\n%s\n' "$documented" "$version" | sort -V | tail -1)" != "$version" ]; then exit 0; fi
          title="Document velt $latest"
          if gh issue list --state all --search "\"$title\" in:title" --json number -q '.[].number' | grep -q .; then
            echo "issue already exists"; exit 0
          fi
          gh label create docs-sync --color 6E5BFF --description "Docs for a change in velt-lang/velt" 2>/dev/null || true
          notes=$(gh release view "$latest" -R velt-lang/velt --json body -q .body)
          {
            echo "velt-lang/velt released [$latest](https://github.com/velt-lang/velt/releases/tag/$latest); the docs describe $documented."
            echo
            echo "Follow the refresh playbook in AGENTS.md: read what changed (\`gh api repos/velt-lang/velt/compare/v$documented...$latest\`), update the pages, bump \`DOCS_VERSION\`, and close this issue and the \`docs-sync\` issues released in $latest from the PR."
            echo
            echo "## Release notes"
            echo
            echo "$notes"
          } > body.md
          gh issue create --title "$title" --label docs-sync --body-file body.md
